# Information Theory conference & journal deadlines
# Format follows sec-deadlines / ai-deadlines conventions:
#   deadline is a LIST (even for one deadline); timezone uses tz names with
#   inverted sign for Etc/GMT zones (AoE = UTC-12 = "Etc/GMT+12", default).
# Tags: IT (core info theory), COMM (communications), CODING (coding theory),
#        ML (learning/statistics), JOURNAL (journal special issues)
#
# All dates below verified against official sources on 2026-08-26.
# Where the CFP gives a date but no time, 23:59 AoE is assumed (the usual convention).

